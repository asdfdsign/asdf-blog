<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포모도로 타이머</title>
  <meta name="description" content="25분 집중, 5분 휴식. 줄어드는 원을 보며 한 번에 하나만.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="./style.css">
  <!-- 첫 페인트 전에 data-theme / data-embed 를 붙여야 하므로 동기 로드 -->
  <script src="./theme.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="back-link" href="../../">← 블로그</a>
    <h1 class="app-title">포모도로 타이머</h1>
    <button class="theme-toggle" type="button" aria-label="다크 모드 전환" aria-pressed="false">
      <svg class="icon icon--sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg class="icon icon--moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="timer" id="timer" data-session="focus" data-status="idle">
    <!-- 세션 줄: 라벨 pill(아이콘 + 문구) · 소리 토글 -->
    <div class="session-bar">
      <span class="session-pill">
        <svg class="icon icon--focus" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
        </svg>
        <svg class="icon icon--rest" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 9h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M16 11h2a2.5 2.5 0 0 1 0 5h-2" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M8 3.5v2M12 3.5v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="session-label">집중</span>
      </span>
      <button class="icon-btn sound-toggle" id="sound" type="button" aria-pressed="true" aria-label="소리 켬" title="소리">
        <svg class="icon icon--sound-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="icon icon--sound-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- 원: 트랙 + 진행 호. 숫자는 SVG 밖 HTML 로 원 중앙에 -->
    <div class="ring-wrap" id="ring-wrap" role="timer" aria-label="집중, 남은 시간 25분">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring__track" cx="50" cy="50" r="45"/>
        <circle class="ring__progress" id="progress" cx="50" cy="50" r="45" pathLength="100"/>
      </svg>
      <div class="digits" id="digits" aria-hidden="true">25:00</div>
    </div>

    <!-- 스크린리더용. 시작·정각·10초·완료 같은 순간에만 문구가 바뀐다 -->
    <p class="sr-only" role="status" aria-live="polite" aria-atomic="true" id="live"></p>

    <div class="actions">
      <button class="icon-btn" id="reset" type="button" aria-label="처음으로" title="처음으로 (R)">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="btn-main" id="main" type="button">
        <svg class="icon icon--play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M7 5v14l11-7z" fill="currentColor"/>
        </svg>
        <svg class="icon icon--pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>
        </svg>
        <span id="main-label">집중 시작</span>
      </button>
      <button class="icon-btn" id="skip" type="button" aria-label="다음 세션으로 건너뛰기" title="건너뛰기 (S)">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M5 5v14l10-7z" fill="currentColor"/>
          <path d="M18 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- 완료 점: interval 개, 채운 수 = cyclePos. 문구는 aria-label 로 -->
    <div class="dots" id="dots" role="img" aria-label="오늘 0회 완료, 다음 긴 휴식까지 4회">
      <span class="dots__list" id="dots-list"></span>
      <span class="dots__sep"></span>
      <span id="dots-count">오늘 0회</span>
    </div>

    <details class="settings" id="settings">
      <summary>설정</summary>
      <div class="settings__body">
        <div class="settings__grid">
          <label for="set-focus">집중 (분)</label>
          <input id="set-focus" data-key="focus" type="number" inputmode="numeric" min="1" max="90" step="1">
          <label for="set-short">짧은 휴식 (분)</label>
          <input id="set-short" data-key="short" type="number" inputmode="numeric" min="1" max="90" step="1">
          <label for="set-long">긴 휴식 (분)</label>
          <input id="set-long" data-key="long" type="number" inputmode="numeric" min="1" max="90" step="1">
          <label for="set-interval">긴 휴식 간격 (회)</label>
          <input id="set-interval" data-key="interval" type="number" inputmode="numeric" min="1" max="8" step="1">
        </div>
        <p class="settings__hint">시간은 1~90분, 간격은 1~8회. 진행 중인 세션에는 다음 세션부터 적용됩니다.</p>
        <div class="settings__actions">
          <button class="btn-text" id="defaults" type="button">기본값으로</button>
          <button class="btn-text" id="clear-today" type="button">오늘 기록 지우기</button>
        </div>
      </div>
    </details>
  </main>

  <script src="./timer.js"></script>
  <script src="./app.js"></script>
</body>
</html>
