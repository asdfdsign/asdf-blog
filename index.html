<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>asdf</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- 첫 페인트 전에 data-theme 를 붙여야 하므로 동기 로드 -->
  <script src="./js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="site-title" href="#/">asdf<span class="site-title__dot">.</span></a>
      <button class="theme-toggle" type="button" aria-label="다크 모드 전환" aria-pressed="false">
        <svg class="icon icon--sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p>마크다운을 브라우저에서 바로 읽는 블로그 · 빌드 없음 · 의존성 없음</p>
    </div>
  </footer>

  <template id="tpl-list">
    <section class="view view--list">
      <div class="hero">
        <h1 class="hero__title">기록<span class="accent">.</span></h1>
        <p class="hero__lead">HTML, CSS, JavaScript만으로 만든 마크다운 블로그. 배운 것을 짧게 남깁니다.</p>
      </div>
      <nav class="cats" aria-label="카테고리"></nav>
      <ol class="post-list"></ol>
      <p class="post-list__empty" hidden>이 카테고리에는 아직 글이 없어요.</p>
    </section>
  </template>

  <template id="tpl-card">
    <li class="post-card">
      <a class="post-card__link" href="#">
        <time class="post-card__date"></time>
        <p class="kicker post-card__kicker" hidden></p>
        <h2 class="post-card__title"></h2>
        <p class="post-card__summary"></p>
      </a>
      <ul class="tags"></ul>
    </li>
  </template>

  <template id="tpl-post">
    <article class="view view--post">
      <a class="back-link" href="#/">← 목록으로</a>
      <header class="post-header">
        <time class="post-header__date"></time>
        <p class="kicker post-header__kicker" hidden></p>
        <h1 class="post-header__title"></h1>
        <ul class="tags"></ul>
      </header>
      <div class="prose"></div>
      <footer class="post-footer">
        <a class="back-link" href="#/">← 목록으로</a>
      </footer>
    </article>
  </template>

  <template id="tpl-error">
    <section class="view view--error">
      <p class="error__code">404</p>
      <h1 class="error__title">글을 찾을 수 없어요</h1>
      <p class="error__message"></p>
      <a class="button" href="#/">목록으로 돌아가기</a>
    </section>
  </template>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
